 {id:'6',num:'06',title:'アクセント',tag:'位置を選択',note:'強く読む音節をタップ',from:'91〜100'}
];
const KEY='tangoplus_exams_2026_v1';
let store={history:{},stars:{},shuffle:false};
try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved && typeof saved==='object')store={...store,...saved}}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean=s=>String(s??'').normalize('NFKC').trim().toLocaleLowerCase('en').replace(/\s+/g,' ');
const getHistory=id=>store.history[id]||{};
const doneCount=questions=>questions.filter(q=>getHistory(q.id).lastCorrect===true).length;
const trouble=()=>QUESTIONS.filter(q=>getHistory(q.id).lastCorrect===false);
let screen='home',session=[],pos=0,selected=null,typed='',ordered=[],graded=false,passed=[],sessionRight=0,sessionWrong=0,lastMode='all';
function shuffled(arr){const out=arr.slice();for(let i=out.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out}
function openHome(){screen='home';renderHome();window.scrollTo(0,0)}
function sectionName(q){return META.find(m=>m.id===q.section)?.title || '演習'}
function start(mode){
 let items=mode==='all'?QUESTIONS:mode==='wrong'?trouble():mode==='star'?QUESTIONS.filter(q=>store.stars[q.id]):QUESTIONS.filter(q=>q.section===mode);
 if(!items.length){const v=$('#inlineMsg'); if(v)v.textContent=mode==='wrong'?'まだ復習が必要な問題はありません。':'この条件に当てはまる問題がありません。';return}
 session=store.shuffle?shuffled(items):items.slice();pos=0;selected=null;typed='';ordered=[];graded=false;passed=[];sessionRight=0;sessionWrong=0;lastMode=mode;screen='quiz';renderQuiz();window.scrollTo(0,0)
}
function renderHome(){
 const completed=doneCount(QUESTIONS),review=trouble().length;
 $('#view').innerHTML=`<section class="hero">
 <div class="panel welcome"><div class="page-eyebrow">YOUR EXAM. YOUR PACE.</div><h1>英単語テスト、<br><span class="gradient">得点源にしよう。</span></h1><p>PDFに掲載された95問を収録。選択・直接入力・並び替え・アクセントを、自分のペースで何度でも練習できます。</p><div class="actions"><button class="primary" data-start="all">▶ 全95問を練習</button><button class="secondary" data-start="wrong">↻ 間違いを復習 ${review?`(${review})`:''}</button></div></div>
 <div class="panel stats"><div class="stat-row"><div class="stat"><strong>${completed}<i> /95</i></strong><span>現在の正解済み</span></div><div class="stat"><strong>${review}</strong><span>復習が必要な問題</span></div></div><div><div class="rail-row"><span>マスター進捗</span><span>${Math.round(completed/QUESTIONS.length*100)}%</span></div><div class="rail"><div style="width:${completed/QUESTIONS.length*100}%"></div></div><div class="rail-row"><span>お気に入り <b style="color:#f3d09f">★ ${Object.keys(store.stars).filter(k=>store.stars[k]).length}</b></span><button class="link-btn" data-start="star">★ お気に入りを練習 →</button></div></div></div>
 </section><div class="sectionhead"><div><h2>出題範囲から選ぶ</h2><p>苦手な形式だけを集中して練習できます</p></div><label class="switchline"><input id="shuffle" type="checkbox" ${store.shuffle?'checked':''}> 問題順をシャッフル</label></div>
 <div class="topics">${META.map(m=>{const qs=QUESTIONS.filter(q=>q.section===m.id),n=doneCount(qs);return `<button class="topic" data-start="${m.id}"><div class="topic-top"><div class="topic-num">${m.num}</div><div class="topic-tag">${m.tag}</div></div><div><strong>${m.title}</strong><small style="display:block;margin-top:3px">${m.note}</small></div><div class="topic-bottom"><span>${m.from}番 · ${n}/${qs.length}問</span><div class="mini-rail"><i style="width:${n/qs.length*100}%"></i></div></div></button>`}).join('')}</div>
 <p class="fineprint" id="inlineMsg">📄 元PDFでは<strong>41〜45番が欠けている</strong>ため、掲載されている95問を収録しています。「3」の選択問題は指定に従い、選択肢を見ない直接入力に変更しています。</p><div style="text-align:right;margin-top:15px"><button class="small-action" id="reset">学習履歴をリセット</button></div>`;
 document.querySelectorAll('[data-start]').forEach(btn=>btn.addEventListener('click',()=>start(btn.dataset.start)));
 $('#shuffle').addEventListener('change',e=>{store.shuffle=e.target.checked;persist()});
 $('#reset').addEventListener('click',()=>{if(confirm('正解履歴・間違い履歴・お気に入りをすべて削除しますか？')){store.history={};store.stars={};persist();renderHome()}})
}
function questionText(q){
 if(q.type==='stress')return '最も強く読む部分はどれ？';
 if(q.type==='sort')return '正しい順番に並び替えよう。';
 return q.prompt;
}
function renderQuiz(){
 if(pos>=session.length){renderFinish();return}
 const q=session[pos],pct=(pos/session.length)*100,md=q.type==='choice'?'正しい選択肢を1つ選ぼう':q.type==='input'?'空欄に入る英語を入力しよう':q.type==='stress'?'第1アクセントの位置を選ぼう':'語句を正しい順番に並べよう';
 const line=q.jp?`<div class="japanese">🇯🇵 ${esc(q.jp)}</div>`:'';
 const question=q.type==='sort'?`<div class="question english">${esc(questionText(q))}</div>${line}`:q.type==='stress'?`<h1 class="question">${esc(questionText(q))}</h1>`:`<h1 class="question ${q.section==='3'||q.section==='5'?'english':''}">${esc(questionText(q))}</h1>${line}`;
 $('#view').innerHTML=`<div class="quiz-layout"><div class="quiz-nav"><button class="back" id="backHome">← 範囲選択へ</button><div class="qtitle"><strong>${esc(sectionName(q))}</strong> · ${esc(q.section==='vocab'?'英語入力':'セクション'+q.section)}</div></div>
 <div class="qprogress"><span>QUESTION <strong>${pos+1}</strong> / ${session.length}</span><span>正解 <b style="color:var(--good)">${sessionRight}</b> / 不正解 <b style="color:var(--bad)">${sessionWrong}</b></span></div><div class="progress"><div style="width:${pct}%"></div></div>
 <section class="panel qpanel"><div class="qid">No. ${q.id}</div><span class="qkind">${md}</span>${question}<div id="answerZone"></div><div id="feedback"></div><div class="quiz-actions"><button class="small-action ${store.stars[q.id]?'bookmarked':''}" id="favorite">${store.stars[q.id]?'★ お気に入り登録済':'☆ お気に入り'}</button><div><button class="plainbtn" id="skip" ${graded?'style="display:none"':''}>スキップ</button><button class="primary" id="check">${graded?(pos===session.length-1?'結果を見る →':'次の問題 →'):'答え合わせ →'}</button></div></div></section></div>`;
 $('#backHome').addEventListener('click',openHome);
 $('#favorite').addEventListener('click',()=>{store.stars[q.id]=!store.stars[q.id];persist();const el=$('#favorite');el.textContent=store.stars[q.id]?'★ お気に入り登録済':'☆ お気に入り';el.classList.toggle('bookmarked',!!store.stars[q.id])});
 $('#check').addEventListener('click',()=>graded?goNext():checkAnswer());
 $('#skip').addEventListener('click',()=>{passed.push(q.id);goNext()});
 renderAnswer(q);
 if(graded)renderFeedback(q);
}
function renderAnswer(q){
 let h='';
 if(q.type==='choice'){
  h=`<div class="instruction">選択肢から1つ選択 ${!graded?'<span class="kbd">1〜4 キーでも選べます</span>':''}</div><div class="options">${q.options.map((v,i)=>`<button class="option ${selected===i?'sel':''} ${graded&&q.answer===i?'good':''} ${graded&&selected===i&&selected!==q.answer?'bad':''}" data-opt="${i}" ${graded?'disabled':''}><span class="num">${i+1}</span><span>${esc(v)}</span></button>`).join('')}</div>`;
 }else if(q.type==='input'){
  h=`<div class="instruction">英単語をスペルまで正確に入力</div><input id="textAnswer" class="entry" type="text" inputmode="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="英語を入力..." ${graded?'disabled':''} value="${esc(typed)}" aria-label="英語の回答欄"><div class="input-hint">半角英字で入力できます · 大文字・小文字は区別しません</div>`;
 }else if(q.type==='sort'){
  h=`<div class="sort-sentence">${esc(q.prefix)} <span class="slot">${ordered.length?ordered.map(i=>esc(q.words[i])).join('　'):'ここに単語を並べる'}</span> ${esc(q.after)}</div><div class="instruction">回答欄（選んだ単語をタップすると戻せます）</div><div class="sort-target">${ordered.map((i,j)=>`<button class="chip answer-chip" data-remove="${j}" ${graded?'disabled':''}>${esc(q.words[i])} ×</button>`).join('')||'<span style="color:var(--muted2);padding:15px;font-size:13px">下の単語を順番にタップ</span>'}</div><div class="instruction">語群</div><div class="sort-bank">${q.words.map((v,i)=>`<button class="chip" data-add="${i}" ${graded||ordered.includes(i)?'disabled':''}>${esc(v)}</button>`).join('')}</div>${graded?'':`<div class="sort-tools"><button class="link-btn" id="undoSort">↶ 1つ戻す</button><button class="link-btn" id="clearSort">すべて戻す</button></div>`}`;
 }else if(q.type==='stress'){
  h=`<div class="instruction">発音するとき、最も強い音節を選択</div><div class="accents">${q.parts.map((p,i)=>`${i?'<span class="interpunct">·</span>':''}<button class="syllable ${selected===i?'sel':''} ${graded&&q.answer===i?'good':''} ${graded&&selected===i&&selected!==q.answer?'bad':''}" data-syllable="${i}" ${graded?'disabled':''} title="${i+1}番目の音節">${esc(p)}</button>`).join('')}</div><div class="input-hint">${q.parts.length}つの音節に分けてあります。音節をタップすると選択できます。</div>`;
 }
 $('#answerZone').innerHTML=h;
 if(q.type==='choice')document.querySelectorAll('[data-opt]').forEach(b=>b.addEventListener('click',()=>{selected=+b.dataset.opt;renderAnswer(q)}));
 if(q.type==='input'&&!graded){const t=$('#textAnswer');t.addEventListener('input',e=>typed=e.target.value);requestAnimationFrame(()=>{if($('#textAnswer') && document.activeElement.tagName!=='BUTTON')$('#textAnswer').focus()})}
 if(q.type==='sort'&&!graded){document.querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click',()=>{ordered.push(+b.dataset.add);renderAnswer(q)}));document.querySelectorAll('[data-remove]').forEach(b=>b.addEventListener('click',()=>{ordered.splice(+b.dataset.remove,1);renderAnswer(q)}));$('#undoSort')?.addEventListener('click',()=>{ordered.pop();renderAnswer(q)});$('#clearSort')?.addEventListener('click',()=>{ordered=[];renderAnswer(q)})}
 if(q.type==='stress')document.querySelectorAll('[data-syllable]').forEach(b=>b.addEventListener('click',()=>{selected=+b.dataset.syllable;renderAnswer(q)}));
}
function completedSentence(q,mark=false){
 const w=q.words.map(x=>x),p=q.answer.map(i=>w[i]);
 const words=p.join(' '),full=[q.prefix,words,q.after].filter(Boolean).join(' ').replace(/\s+\./g,'.').replace(/\s+([,!?:;])/g,'$1');
 return full.replace(/^./,c=>c.toUpperCase());
}
function answerDisplay(q){
 switch(q.type){
 case 'choice': return q.options[q.answer];
 case 'input':return q.answer;
 case 'sort':return completedSentence(q);
 case 'stress':return q.parts.map((s,i)=>i===q.answer?'【'+s+'】':s).join('・');
 }
}
function checkAnswer(){
 const q=session[pos];if(graded)return;
 if(q.type==='choice'&&selected===null){notify('選択肢を1つ選んでください');return}
 if(q.type==='input'&&!clean(typed)){notify('英語を入力してください');return}
 if(q.type==='sort'&&ordered.length!==q.words.length){notify('すべての語句を並べてください');return}
 if(q.type==='stress'&&selected===null){notify('アクセントの位置を1つ選んでください');return}
 let right=false;
 if(q.type==='choice'||q.type==='stress')right=selected===q.answer;
 else if(q.type==='input')right=clean(typed)===clean(q.answer);
 else right=ordered.every((id,i)=>clean(q.words[id])===clean(q.words[q.answer[i]]));
 graded=true;const old=getHistory(q.id);store.history[q.id]={attempts:(old.attempts||0)+1,correct:(old.correct||0)+(right?1:0),lastCorrect:right};persist();
 if(right)sessionRight++;else sessionWrong++;
 renderAnswer(q);renderFeedback(q,right);
 $('#skip').style.display='none';$('#check').textContent=pos===session.length-1?'結果を見る →':'次の問題 →';
}
function renderFeedback(q,right=getHistory(q.id).lastCorrect){
 const v=$('#feedback'),disp=answerDisplay(q);
 let more='';
 if(q.type==='sort')more=`正しい英文：${esc(disp)}`;
 else if(q.type==='input'&&(q.section==='3'||q.section==='5'))more=`完成した英文：${esc(q.prompt.replace(/\(____\)/,q.answer))}`;
 else if(q.type==='choice'&&q.section==='2')more=`${esc(q.prompt)} = ${esc(disp)}`;
 else if(q.type==='choice')more=`${esc(q.prompt)} = ${esc(disp)}`;
 else if(q.type==='stress')more=`アクセントは <b>${q.answer+1}番目</b> の音節です。`;
 const actual=q.type==='input'&&!right?`<div class="desc">あなたの回答：${esc(typed)}</div>`:'';
 v.innerHTML=`<div class="result ${right?'good':'bad'}" role="status"><h3>${right?'✓ 正解！':'✕ 不正解 · 復習に追加しました'}</h3><div class="correct">正解：${esc(disp)}</div>${actual}${more?`<div class="desc">${more}</div>`:''}</div>`;
}
function notify(msg){let target=$('#feedback');target.innerHTML=`<div class="empty-msg" role="alert">${esc(msg)}</div>`;setTimeout(()=>{const box=$('#feedback');if(box?.textContent===msg)box.innerHTML=''},2200)}
function goNext(){pos++;selected=null;typed='';ordered=[];graded=false;renderQuiz();window.scrollTo({top:0,behavior:'instant'})}
function renderFinish(){screen='finish';const len=session.length,pct=len?Math.round(sessionRight/len*100):0;
 $('#view').innerHTML=`<div class="quiz-layout"><section class="panel finish"><div class="finish-emoji">${pct===100?'🏆':pct>=80?'✨':'📚'}</div><div class="page-eyebrow">SESSION COMPLETE</div><h1>おつかれさま！</h1><p>今回の演習結果です。間違えた問題は自動で復習リストに入っています。</p><div class="finish-score">${pct}<span style="font-size:26px">%</span></div><div class="finish-stats"><span>正解 <strong>${sessionRight}</strong></span><span>不正解 <strong>${sessionWrong}</strong></span><span>スキップ <strong>${passed.length}</strong></span></div><div class="actions"><button class="primary" id="retry">同じ範囲にもう一度挑戦</button><button class="secondary" id="retryWrong">間違えた問題を復習</button><button class="plainbtn" id="finishHome">範囲選択へ</button></div></section></div>`;
 $('#retry').addEventListener('click',()=>start(lastMode==='wrong' && trouble().length===0 ? 'all':lastMode));$('#retryWrong').addEventListener('click',()=>start('wrong'));$('#finishHome').addEventListener('click',openHome)
}
window.addEventListener('keydown',ev=>{
 if(screen!=='quiz')return;
 if(ev.ctrlKey||ev.metaKey||ev.altKey)return;
 const q=session[pos];if(!q)return;
 if(ev.key==='Enter'&&(q.type==='input'||ev.target.tagName!=='BUTTON')){ev.preventDefault();if(graded)goNext();else checkAnswer();return}
 if(ev.target.tagName==='INPUT')return;
 if(!graded && /^[1-9]$/.test(ev.key)){
  const i=Number(ev.key)-1;if(q.type==='choice'&&i<4||q.type==='stress'&&i<q.parts.length){selected=i;renderAnswer(q)}
 }
 if(!graded&&q.type==='sort'&&ev.key==='Backspace'){ordered.pop();renderAnswer(q)}
});
$('#homeLink').addEventListener('click',openHome);
openHome();
</script>
</body>
</html>
